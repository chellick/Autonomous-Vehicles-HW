services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.21.3
    ports:
      - "${MLFLOW_PORT:-6777}:${MLFLOW_PORT:-6777}"
    volumes:
      - ./runs:/runs
      - ./mlflow_data:/mlflow_data
    command: >
      mlflow server
      --host 0.0.0.0
      --port ${MLFLOW_PORT:-6777}
      --backend-store-uri sqlite:////mlflow_data/mlflow.db
      --default-artifact-root /runs
    restart: unless-stopped
