seed: 42
name:

project:
  runs_dir: runs
  models_dir: models

data:
  dataset_root: data/Self-Driving-Car-3
  images_dir: export/images
  labels_dir: export/labels
  meta_file: data.yaml
  split_dir: splits/self_driving_car
  split_seed: 42
  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1

model:
  weights: yolov8n.pt
  weights_dir: models
  default_model: models/best_yolo_auto_trasnport.pt

train:
  epochs: 30
  imgsz: 640
  batch: 64
  device:
  workers: 4
  exist_ok: true
  deterministic: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3
  close_mosaic: 10
  cos_lr: true
  patience: 15
  box: 7.5
  cls: 0.5
  dfl: 1.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  amp: true
  plots: true
  save: true
  save_period: 5
  verbose: true

eval:
  data: splits/self_driving_car/data.yaml
  split: test
  imgsz: 640
  batch: 16
  conf: 0.001
  iou: 0.6
  device:
  workers: 2
  exist_ok: true
  save_json: false
  plots: false
  verbose: true

inference:
  model: models/best_yolo_auto_trasnport.pt
  source: splits/self_driving_car/test.txt
  imgsz: 640
  conf: 0.25
  iou: 0.7
  device:
  exist_ok: true
  save_txt: false
  save_conf: false
  verbose: false
